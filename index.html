<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferrofluid Voice Interface — 6 up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#e08a2c;
    --bg:#08070a; --fg:242,238,233; --thumb:#f2eee9;
  }
  body.light{ --bg:#eceae5; --fg:16,14,20; --thumb:#14121a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,sans-serif;color:rgb(var(--fg));-webkit-font-smoothing:antialiased;transition:background .35s}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

  .stage{position:fixed;left:0;top:0;bottom:64px;right:0;pointer-events:none;transition:right .28s ease,bottom .35s ease}
  body.side-open .stage{right:312px}

  .rail{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;z-index:6;transition:margin-right .28s ease,opacity .35s ease;
  }
  body.side-open .rail{margin-right:312px}
  .chip{
    font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    background:transparent;border:1px solid rgba(var(--fg),.14);border-radius:2px;
    color:rgba(var(--fg),.45);padding:8px 11px;cursor:pointer;
    display:flex;align-items:baseline;gap:7px;transition:color .18s,border-color .18s,background .18s;
  }
  .chip .n{font-family:"JetBrains Mono",monospace;font-size:11px;color:rgba(var(--fg),.55)}
  .chip:hover{color:rgba(var(--fg),.85);border-color:rgba(var(--fg),.3)}
  .chip[aria-selected="true"]{
    background:rgba(var(--fg),.07);border-color:rgba(var(--fg),.45);color:rgba(var(--fg),.95);
  }
  .chip[aria-selected="true"] .n{color:var(--amber)}
  .chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .chip .nm{display:inline}
  @media (max-width:820px){ .chip .nm{display:none} }
  @media (max-width:960px){ .meters{display:none} }
  @media (max-width:760px){
    .bar{gap:10px;padding:0 12px}
    .bar .mark{display:none}
    button.btn{padding:10px 12px;letter-spacing:.12em}
  }
  @media (max-width:700px){ .state span{display:none} }

  .side{
    position:fixed;top:0;bottom:64px;right:0;width:312px;
    border-left:1px solid rgba(var(--fg),.12);
    background-color:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:blur(18px) saturate(0.8);
    padding:22px 22px 28px;overflow-y:auto;z-index:7;
    transform:translateX(100%);transition:transform .28s ease;
    scrollbar-width:thin;scrollbar-color:rgba(var(--fg),.2) transparent;
  }
  body.side-open .side{transform:none}
  .side h2{
    font-size:9px;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(var(--fg),.38);font-weight:500;margin:0 0 4px;
  }
  .side .sect{margin-bottom:26px}
  .side .sect > p{font-size:10px;color:rgba(var(--fg),.34);line-height:1.5;margin-bottom:14px}
  .side .row{display:flex;gap:8px;margin-top:14px}
  .ctl{margin-bottom:13px}
  .ctl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:rgba(var(--fg),.6);margin-bottom:5px;
  }
  .ctl label var{font-family:"JetBrains Mono",monospace;font-style:normal;color:rgba(var(--fg),.38)}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:2px;
    background:rgba(var(--fg),.16);border-radius:2px;outline:none;display:block;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--thumb);cursor:pointer;
  }
  input[type=range]:focus-visible{outline:2px solid var(--amber);outline-offset:5px}

  .bar{
    position:fixed;left:0;right:0;bottom:0;height:64px;
    border-top:1px solid rgba(var(--fg),.09);background:var(--bg);
    display:flex;align-items:center;gap:18px;padding:0 22px;
    transition:opacity .35s ease;
  }

  /* fullscreen: everything steps out of the room except the orb */
  body.zen .rail, body.zen .bar{opacity:0;pointer-events:none}
  body.zen .stage{bottom:0}
  .zenExit{
    position:fixed;top:16px;right:18px;z-index:9;display:none;
    font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    background:color-mix(in srgb, var(--bg) 60%, transparent);
    backdrop-filter:blur(6px);
    border:1px solid rgba(var(--fg),.12);border-radius:2px;
    color:rgba(var(--fg),.30);padding:8px 12px;cursor:pointer;
    transition:color .18s,border-color .18s;
  }
  body.zen .zenExit{display:block}
  .zenExit:hover{color:rgba(var(--fg),.85);border-color:rgba(var(--fg),.35)}
  .bar .mark{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(var(--fg),.34)}
  .bar .mark b{color:rgba(var(--fg),.8);font-weight:500}
  .spacer{flex:1}
  button.btn{
    font:inherit;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(var(--fg),.9);background:rgba(var(--fg),.05);
    border:1px solid rgba(var(--fg),.18);border-radius:2px;padding:10px 18px;cursor:pointer;
  }
  button.btn:hover{background:rgba(var(--fg),.1);border-color:rgba(var(--fg),.34)}
  button.btn:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  button.btn.quiet{color:rgba(var(--fg),.5)}

  .meters{display:flex;gap:14px;font-family:"JetBrains Mono",monospace;font-size:9px;color:rgba(var(--fg),.34)}
  .m{display:flex;flex-direction:column;gap:5px;min-width:44px}
  .m span{letter-spacing:.14em;text-transform:uppercase}
  .mb{width:44px;height:2px;background:rgba(var(--fg),.12);position:relative;overflow:hidden}
  .mb i{position:absolute;inset:0 auto 0 0;width:0%;background:rgba(var(--fg),.75)}
  .m.acc .mb i{background:var(--amber)}
  .state{display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(var(--fg),.5)}
  .dot{width:5px;height:5px;border-radius:50%;background:rgba(var(--fg),.28)}
  .dot.live{background:var(--amber);box-shadow:0 0 10px rgba(224,138,44,.8)}
  .dot.error{background:#b8433a}
  .intro{
    position:fixed;inset:0;z-index:20;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;text-align:center;
    transition:opacity .7s ease, visibility .7s;
  }
  .intro.gone{opacity:0;visibility:hidden;pointer-events:none}
  .intro-in{max-width:340px;padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .intro-lead{
    font-size:11px;letter-spacing:.30em;text-transform:uppercase;
    color:rgba(var(--fg),.85);
  }
  .intro-lead::after{
    content:'';display:block;width:26px;height:1px;margin:14px auto 0;
    background:rgba(var(--fg),.4);
    animation:sweep 1.5s ease-in-out infinite;
  }
  .intro.settled .intro-lead::after{animation:none;opacity:.25}
  @keyframes sweep{0%,100%{transform:scaleX(.3);opacity:.3}50%{transform:scaleX(1);opacity:.9}}
  .intro-sub{font-size:11px;line-height:1.7;color:rgba(var(--fg),.4);letter-spacing:.04em}
  .intro button[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){ .intro-lead::after{animation:none} }

  .toast{
    position:fixed;bottom:82px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    background:rgba(var(--fg),.08);border:1px solid rgba(var(--fg),.16);
    padding:9px 16px;border-radius:2px;color:rgba(var(--fg),.8);
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1}
  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(260px, 42vh)}
    .cell:nth-child(3n){border-right:1px solid rgba(var(--fg),.07)}
    .cell:nth-child(2n){border-right:none}
    .meters{display:none}
  }
  @media (max-width:620px){
    .grid{grid-template-columns:1fr}
    .cell{border-right:none !important}
    .panel{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="stage" id="stage"></div>
<div class="rail" id="rail"></div>
<aside class="side" id="side"></aside>

<div class="bar">
  <div class="mark"><b>Ferrofluid</b> &nbsp;/&nbsp; <span id="modeName">Wisp</span> &nbsp;/&nbsp; v1.0</div>
  <div class="state"><i class="dot" id="dot"></i><span id="stateLabel">Idle</span></div>
  <div class="spacer"></div>
  <div class="meters">
    <div class="m"><span>Voice</span><div class="mb"><i id="mLow"></i></div></div>
    <div class="m"><span>Formant</span><div class="mb"><i id="mMid"></i></div></div>
    <div class="m"><span>Sib</span><div class="mb"><i id="mHigh"></i></div></div>
    <div class="m acc"><span>Onset</span><div class="mb"><i id="mOnset"></i></div></div>
    <div class="m acc"><span>Voiced</span><div class="mb"><i id="mVoiced"></i></div></div>
  </div>
  <button class="btn quiet" id="themeBtn">Light</button>
  <button class="btn quiet" id="allBtn">Controls</button>
  <button class="btn quiet" id="resetBtn">Reset</button>
  <button class="btn quiet" id="fsBtn">Fullscreen</button>
  <button class="btn" id="micBtn">Start listening</button>
</div>
<button class="zenExit" id="zenExit">Exit</button>
<div class="toast" id="toast"></div>

<div class="intro" id="intro">
  <div class="intro-in">
    <p class="intro-lead" id="introLead">Turning on the microphone</p>
    <p class="intro-sub" id="introSub">Your voice drives the fluid. Nothing is recorded or sent anywhere.</p>
    <button class="btn" id="introBtn" hidden>Try again</button>
  </div>
</div>
<script>
/* ================================================================== */
/* GL                                                                  */
/* ================================================================== */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', {antialias:false, alpha:false});
const MAXB = 96;

const VERT = `attribute vec2 aPos; void main(){ gl_Position = vec4(aPos,0.0,1.0); }`;

const FRAG = `
precision highp float;
uniform vec2  uCenter;
uniform float uDiscR;
uniform vec3  uBalls[${MAXB}];
uniform int   uCount;
uniform float uTime;
uniform float uWarp;
uniform float uInvert;
uniform float uStyle;
uniform vec2  uLight;
uniform float uGlow;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }

float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  float a = hash(i), b = hash(i+vec2(1.0,0.0));
  float c = hash(i+vec2(0.0,1.0)), d = hash(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}

vec2 turbulence(vec2 p, float t){
  vec2 lo = vec2(vnoise(p*2.7 + vec2(t*0.31, -t*0.19)),
                 vnoise(p*2.7 + vec2(19.3,7.7) + vec2(-t*0.237, t*0.283))) - 0.5;
  vec2 hi = vec2(vnoise(p*6.3 + vec2(t*0.61, t*0.47)),
                 vnoise(p*6.3 + vec2(4.1,12.9) - vec2(t*0.53, t*0.409))) - 0.5;
  return lo + hi*0.45;
}

float fieldGrad(vec2 p, out vec2 grad){
  float f = 0.0; vec2 g = vec2(0.0);
  for(int i = 0; i < ${MAXB}; i++){
    if(i >= uCount) break;
    vec3 b = uBalls[i];
    vec2 d = p - b.xy;
    float dd = dot(d,d) + 1e-4;
    float k = b.z*b.z;
    f += k/dd;
    g += (-2.0*k*d)/(dd*dd);
  }
  grad = g; return f;
}

void main(){
  vec2 p = (gl_FragCoord.xy - uCenter) / uDiscR;
  float r = length(p);

  if(uStyle > 0.5){
    /* Wisp: an emissive soft body, nothing ferrofluid about it.
       Pale mint mass, cyan-to-indigo fringe at the silhouette, blue halo
       bleeding into black. The blue reaches furthest out and the red pulls
       furthest in, which is what makes the rim read as a lens fringe. */
    vec2 pw = p + turbulence(p*0.7, uTime*0.35) * uWarp;
    vec2 grad;
    float f = fieldGrad(pw, grad);
    float gmag = max(length(grad), 1e-4);
    float sd = (f - 1.0) / gmag;
    float sdo = min(sd, 0.0);
    /* sd is only a distance near the isoline; deep inside the field the
       gradient spikes at ball centers and sd dips, so gate everything
       edge-flavored on the raw field too */
    float inside = smoothstep(1.12, 1.55, f);
    float haloM = 1.0 - inside;

    vec2 lp = pw - uLight;
    float core = exp(-dot(lp, lp) * 2.4);

    vec3 wcol;
    if(uStyle > 1.5){
      /* Halo: the same body drawn in daylight. Paper ground, pale blue
         inside, the rim an honest blue line. On white a halo cannot add
         light, so it darkens toward blue instead. */
      wcol = vec3(0.965, 0.972, 0.985);
      wcol = mix(wcol, vec3(0.700, 0.800, 0.970), exp(sdo*10.0) * 0.38 * uGlow * haloM);
      wcol = mix(wcol, vec3(0.360, 0.540, 0.960), exp(sdo*44.0) * 0.72 * uGlow * haloM);

      vec3 body = mix(vec3(0.780, 0.872, 0.985), vec3(0.930, 0.962, 1.000), core*0.80);
      body = mix(body, vec3(0.705, 0.822, 0.980), smoothstep(0.05, -0.45, pw.y) * 0.40);
      float a = smoothstep(-0.008, 0.016, sd);
      wcol = mix(wcol, body, max(a, inside));
      float rim = smoothstep(0.026, 0.007, abs(sd)) * haloM;
      wcol = mix(wcol, vec3(0.300, 0.500, 0.960), rim*0.80);
    } else {
      wcol = vec3(0.006, 0.009, 0.016);
      wcol += vec3(0.030, 0.105, 0.230) * (uGlow * exp(sdo * 10.0)) * haloM;
      wcol += vec3(0.110, 0.260, 0.850) * (uGlow * 0.70 * exp(sdo * 44.0)) * haloM;

      vec3 body = mix(vec3(0.760, 0.905, 0.845), vec3(0.955, 1.000, 0.965), core*0.80);
      body = mix(body, vec3(0.700, 0.900, 0.790), smoothstep(0.05, -0.45, pw.y) * 0.40);
      body *= 1.0 - 0.070 * smoothstep(0.085, 0.015, sd) * haloM;
      body *= 0.90 + 0.10 * uGlow;

      vec3 cov = vec3(smoothstep(0.000, 0.030, sd),
                      smoothstep(-0.010, 0.024, sd),
                      smoothstep(-0.022, 0.016, sd));
      cov = max(cov, vec3(inside));
      wcol = wcol*(1.0 - cov) + body*cov;
    }

    wcol = mix(wcol, vec3(1.0) - wcol, uInvert);
    wcol += (hash(gl_FragCoord.xy + fract(uTime)) - 0.5) * 0.006;

    if(uStyle < 1.5){
      /* film hiss: sparse white dust, re-rolled at 24 fps like a print */
      float fr = floor(uTime*24.0);
      float cs = max(uDiscR*0.011, 2.0);
      vec2 cell = floor(gl_FragCoord.xy / cs);
      float dust = step(0.9990, hash(cell + vec2(fr*0.37, fr*1.13)));
      vec2 lc = fract(gl_FragCoord.xy / cs) - 0.5;
      float shape = smoothstep(0.50, 0.10, length(lc));
      float bright = 0.25 + 0.55*hash(cell + vec2(fr*2.71, 41.7));
      wcol += dust * shape * bright * (1.0 - uInvert);
    }
    gl_FragColor = vec4(wcol, 1.0);
    return;
  }

  vec3 col = vec3(0.030, 0.028, 0.034);
  col += 0.016 * smoothstep(2.0, 0.7, r);

  float inD = smoothstep(1.001, 0.993, r);
  if(inD > 0.001){
    vec3 disc = vec3(0.965);
    disc *= 1.0 - 0.055 * smoothstep(0.55, 1.0, r);
    col = mix(col, disc, inD);
  }
  float ring = smoothstep(1.030, 1.020, r) * smoothstep(0.992, 1.000, r);
  col = mix(col, vec3(0.115,0.110,0.125), ring);

  if(r < 0.998 && uCount > 0){
    vec2 pw = p + turbulence(p, uTime) * uWarp;
    vec2 grad;
    float f = fieldGrad(pw, grad);
    float gmag = max(length(grad), 1e-4);
    float sd = (f - 1.0) / gmag;
    float px = 1.3 / uDiscR;
    float a = smoothstep(-px, px, sd) * smoothstep(0.998, 0.988, r);
    if(a > 0.002) col = mix(col, vec3(0.050,0.047,0.057), a);
  }

  col = mix(col, vec3(1.0) - col, uInvert);
  col += (hash(gl_FragCoord.xy + fract(uTime)) - 0.5) * 0.006;
  gl_FragColor = vec4(col, 1.0);
}`;

function compile(t, s){
  const sh = gl.createShader(t);
  gl.shaderSource(sh, s); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {
  center: gl.getUniformLocation(prog,'uCenter'),
  discR:  gl.getUniformLocation(prog,'uDiscR'),
  balls:  gl.getUniformLocation(prog,'uBalls'),
  count:  gl.getUniformLocation(prog,'uCount'),
  time:   gl.getUniformLocation(prog,'uTime'),
  warp:   gl.getUniformLocation(prog,'uWarp'),
  invert: gl.getUniformLocation(prog,'uInvert'),
  style:  gl.getUniformLocation(prog,'uStyle'),
  light:  gl.getUniformLocation(prog,'uLight'),
  glow:   gl.getUniformLocation(prog,'uGlow'),
};

/* ================================================================== */
/* Presets: six takes on the same idea                                 */
/* ================================================================== */
const CONTROLS = [
  ['sens',     'Sensitivity',   0.3,  2.5,  0.01],
  ['gate',     'Voice gate',    0,    1,    0.01],
  ['turb',     'Turbulence',    0,    1.5,  0.01],
  ['sharp',    'Sharpness',     0,    1,    0.01],
  ['visc',     'Viscosity',     0,    1,    0.01],
  ['weight',   'Weight',        0,    1,    0.01],
  ['splash',   'Splash',        0,    1,    0.01],
  ['hold',     'Hold',          0.1,  3.0,  0.05],
  ['breakup',  'Break-up',      0,    1,    0.01],
  ['breakRate','Break rate',    0,    1,    0.01],
  ['wobble',   'Irregularity',  0,    1,    0.01],
  ['life',     'Aliveness',     0,    1,    0.01],
  ['attnHold', 'Attention hold',0,    1,    0.01],
];

/* what belongs to the preset itself: its size, its shape, how it behaves */
const PRESET_CONTROLS = [
  ['shape',  'Magnet shape', 0,    5,    1],
  ['morph',  'Shape cycle',  0,    1,    1],
  ['thick',  'Strand',       0.02, 0.10, 0.005],
  ['ball',   'Body size',    0.05, 0.34, 0.005],
  ['reach',  'Spike reach',  0.15, 0.85, 0.01],
  ['spikes', 'Spike count',  5,    20,   1],
  ['rest',   'Rest gather',  0,    1,    0.01],
  ['gathr',  'Peak gather',  0,    1,    0.01],
  ['lift',   'Float mode',   0,    1,    1],
  ['buoy',   'Lift per beat',0,    1,    0.01],
  ['pull',   'Downward pull',0,    1,    0.01],
  ['split',  'Divide in two',0,    1,    1],
];
const SHAPE_NAMES = ['Blob','Bar','Ring','Arc','Triangle','Square'];

/* one set of values, driving all nine */
const G = {
  sens:1.05, gate:0.35, turb:0.75, sharp:0.62, visc:0.55, weight:0.28,
  splash:0.72, hold:1.30, breakup:0.60, breakRate:0.55, wobble:0.55,
  life:0.65, attnHold:0.55,
};
const G_DEFAULTS = {...G};

/* Magnet shapes. Each returns [x, y, outward nx, ny, cornerness] on a unit
   footprint, sampled by arc length so the fluid spreads evenly along it.
   0 is the plain blob, which keeps 1-6 exactly as they were. */
const POLYS = {
  bar:      [[-0.17,-1.0],[0.17,-1.0],[0.17,1.0],[-0.17,1.0]],
  triangle: [[0,1.05],[-0.95,-0.62],[0.95,-0.62]],
  square:   [[-0.80,-0.80],[0.80,-0.80],[0.80,0.80],[-0.80,0.80]],
};
const POLY_CACHE = {};
function polyData(key){
  if(POLY_CACHE[key]) return POLY_CACHE[key];
  const v = POLYS[key];
  const segs = [];
  let total = 0, cxs = 0, cys = 0;
  for(let i=0;i<v.length;i++){
    const a = v[i], c = v[(i+1)%v.length];
    const dx = c[0]-a[0], dy = c[1]-a[1];
    const len = Math.hypot(dx,dy);
    segs.push({a, dx, dy, len, at:total});
    total += len; cxs += a[0]; cys += a[1];
  }
  cxs /= v.length; cys /= v.length;
  for(const s of segs){
    let nx = s.dy/s.len, ny = -s.dx/s.len;
    const mx = s.a[0] + s.dx*0.5 - cxs, my = s.a[1] + s.dy*0.5 - cys;
    if(nx*mx + ny*my < 0){ nx = -nx; ny = -ny; }
    s.nx = nx; s.ny = ny;
  }
  return (POLY_CACHE[key] = {segs, total});
}
function polyPoint(key, t, out){
  const {segs, total} = polyData(key);
  const d = ((t % 1) + 1) % 1 * total;
  for(let i=0;i<segs.length;i++){
    const s = segs[i];
    if(d <= s.at + s.len || i === segs.length-1){
      const u = Math.min(1, (d - s.at)/s.len);
      out[0] = s.a[0] + s.dx*u;
      out[1] = s.a[1] + s.dy*u;
      out[2] = s.nx; out[3] = s.ny;
      /* corners get the longest spikes, the way field lines crowd a vertex */
      const edge = Math.min(u, 1-u) * s.len;
      out[4] = Math.max(0, 1 - edge/0.30);
      return;
    }
  }
}
function shapePoint(shape, t, out){
  if(shape === 2){                       /* ring */
    const a = t*Math.PI*2;
    out[0] = Math.cos(a); out[1] = Math.sin(a);
    out[2] = Math.cos(a); out[3] = Math.sin(a); out[4] = 0;
  }else if(shape === 3){                 /* arc, open at the top */
    const a = Math.PI + t*Math.PI*1.30;
    out[0] = Math.cos(a); out[1] = Math.sin(a);
    out[2] = Math.cos(a); out[3] = Math.sin(a);
    out[4] = Math.max(0, 1 - Math.min(t, 1-t)/0.10);
  }else if(shape === 1){ polyPoint('bar', t, out); }
  else if(shape === 4){ polyPoint('triangle', t, out); }
  else if(shape === 5){ polyPoint('square', t, out); }
  else {                                 /* 0: blob */
    const a = t*Math.PI*2;
    out[0] = Math.cos(a); out[1] = Math.sin(a);
    out[2] = Math.cos(a); out[3] = Math.sin(a); out[4] = 0;
  }
}
const CYCLE = [4, 5, 1, 2, 3];           /* what shape cycle steps through */
const _pa = [0,0,0,0,0], _pb = [0,0,0,0,0];
function simShapePoint(sim, t, out){
  shapePoint(sim.shapeA, t, _pa);
  if(sim.morphT >= 0.999){
    for(let i=0;i<5;i++) out[i] = _pa[i];
    return;
  }
  shapePoint(sim.shapeB, t, _pb);
  const m = sim.morphT;
  for(let i=0;i<5;i++) out[i] = _pb[i]*(1-m) + _pa[i]*m;
}

/* ================================================================== */
/* Simulation                                                          */
/* ================================================================== */
const NPOOL = 5, PERSPIKE = 4, MAXDROPS = 8, SLICES = 24;
const VOICE_LO = 140, VOICE_HI = 5200;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function makeSpikes(sim){
  const n = Math.max(5, Math.min(20, Math.round(sim.p.spikes)));
  sim.spikes = Array.from({length:n}, (_, i) => {
    const u = n > 1 ? (i/(n-1))*2 - 1 : 0;
    return {
      u, x:u*0.50, len:0.03, vel:0, energy:0,
      phase: Math.random()*6.28,
      rate: 0.31 + Math.random()*0.47,
      gain: 0.75 + Math.random()*0.5,
      gainT: Math.random()*6.28,
      bias: Math.random()*2 - 1,
      biasT: Math.random()*6.28,
      walk: 0, theta: Math.PI - i*(Math.PI*2/n),
      tipX:0, tipY:0, dirX:0, dirY:1,
    };
  });
  sim.spikes.map((s,i) => ({i, k:Math.abs(s.u) + i*1e-4}))
    .sort((a,b) => a.k - b.k)
    .forEach((o,b) => { sim.spikes[o.i].band = b; });
}

function applyGlobals(sim){
  const p = sim.p, e = sim.e;
  for(const k in p) e[k] = p[k];
  e.sens = G.sens; e.gate = G.gate; e.turb = G.turb; e.sharp = G.sharp;
  e.visc = G.visc; e.weight = G.weight; e.splash = G.splash; e.hold = G.hold;
  e.reach = p.reach;
  e.ball  = p.ball;
}

function makeSim(preset){
  const sim = {
    p: {...preset}, e: {...preset},
    chunks: Array.from({length:4}, () => ({x:0, y:0, vx:0, vy:0, cool:Math.random()*3.0})),
    chunkN: 4, excite: 0,
    drops: [], gather: preset.rest, gatherVel: 0, gatherHold: 0, spin: 0,
    voiced: 0, level: 0, bass: 0, balls: new Float32Array(MAXB*3),
    shapeA: preset.shape, shapeB: preset.shape, morphT: 1, cycleI: 0, wasHolding: false,
    hover: 0, hoverVel: 0, riseY: 0,
    seed: Math.random()*100,
    breathT: Math.random(), attn: 0, prevAttn: 0, hab: 0, novelty: 0,
    focusA: Math.random()*6.28, focusR: 0, focusTimer: 1, leanX: 0, leanY: 0,
    coil: 0, bob: 0, bobVel: 0, idleTwitch: 2 + Math.random()*4,
    sep: 0, sepVel: 0, axis: Math.random()*6.28, splitCool: 0, quiet: 0,
  };
  makeSpikes(sim);
  return sim;
}
const sims = PRESETS.map(makeSim);

function moundY(x, level){
  return -0.66 + 0.17*Math.exp(-(x*x)/0.20) + level*0.11;
}

/* ------------------------------------------------------------------ */
/* Wisp: its own tiny sim. One core ball and three slow orbiters on    */
/* damped springs; the metaball union is the pebble that never stops   */
/* drifting between shapes.                                            */
/* ------------------------------------------------------------------ */
function stepWisp(sim, dt, time){
  const p = sim.e;
  if(!sim.w){
    sim.w = { rot: Math.random()*6.28, harm: [], lx: 0.20, ly: 0.26,
              la: Math.random()*6.28, glow: 0.8, swell: 0 };
    for(let i=0;i<3;i++) sim.w.harm.push({
      off: 0, vel: 0, ph: Math.random()*6.28,
      rate: 0.16 + 0.10*i + Math.random()*0.08,
    });
  }
  const w = sim.w;
  sim.excite = Math.max(0, sim.excite - dt*1.5);

  /* the tumble, quicker when it is paying attention */
  w.rot += dt*(0.30 + 0.18*sim.attn + p.turb*0.14);

  /* the wobble lives on springs so a push rings out instead of snapping;
     a whisper of random drive keeps the surface alive even in silence */
  for(const h of w.harm){
    h.ph += dt*h.rate*Math.PI*2*(0.6 + p.turb*0.6);
    h.vel += -h.off*7.5*dt;
    h.vel += (Math.random() - 0.5)*2.0*dt*(0.6 + G.life);
    h.vel -= h.vel*Math.min(1, dt*(1.6 + p.visc*2.4));
    h.off += h.vel*dt;
  }

  /* calm presence: level swells it a little, attention a little more */
  const st = sim.level*0.20 + sim.attn*0.06;
  w.swell += (st - w.swell)*Math.min(1, dt*3.0);

  /* the inner light wanders on its own and leans where the focus leans */
  w.la += dt*0.30;
  const tx = 0.20 + Math.cos(w.la)*0.10 + sim.leanX*1.6;
  const ty = 0.26 + Math.sin(w.la*0.77)*0.09 + sim.leanY*1.2;
  w.lx += (tx - w.lx)*Math.min(1, dt*0.8);
  w.ly += (ty - w.ly)*Math.min(1, dt*0.8);

  const gt = 0.72 + sim.level*0.45 + onsetPulse*0.18;
  w.glow += (gt - w.glow)*Math.min(1, dt*5.0);
}

function buildWispBalls(sim, time){
  const w = sim.w, p = sim.e, B = sim.balls;
  if(!w) return 0;
  let n = 0;
  const put = (x,y,r) => { B[n*3]=x; B[n*3+1]=y; B[n*3+2]=r; n++; };
  const breath = Math.sin(sim.breathT*Math.PI*2);
  const swell = (1 + G.life*0.050*breath + w.swell) * (p.ball/0.30);
  const cx = sim.leanX*0.9 + Math.sin(time*0.31 + sim.seed)*0.048;
  const cy = sim.leanY*0.9 + sim.bob*0.10 + Math.cos(time*0.27 + sim.seed*2)*0.042;
  /* three big overlapping lobes make the silhouette; lobe 0 is the nose
     with the longest reach, which is what turns the circle into an egg
     or a teardrop as it swings around. Recentre on the lobes' mean so
     the mass stays put while the outline moves. */
  const DB = [0.165, 0.115, 0.100];
  const DR = [0.125, 0.095, 0.080];
  const RB = [0.262, 0.246, 0.236];
  let mx = 0, my = 0;
  const L = [];
  for(let i=0;i<3;i++){
    const h = w.harm[i];
    const a = w.rot + i*(Math.PI*2/3) + Math.sin(h.ph)*1.05;
    const d = (DB[i] + DR[i]*Math.sin(h.ph*0.9 + i*1.7) + h.off) * swell;
    const lx = Math.cos(a)*d, ly = Math.sin(a)*d*0.92;
    L.push([lx, ly, (RB[i] + 0.026*Math.sin(h.ph*1.3 + i)) * swell]);
    mx += lx/3; my += ly/3;
  }
  const ox = cx - mx*0.62, oy = cy - my*0.62;
  put(ox, oy, 0.16*swell);
  for(const l of L) put(ox + l[0], oy + l[1], l[2]);
  return n;
}

function buildBalls(sim, time){
  if(sim.p.wisp) return buildWispBalls(sim, time);
  const p = sim.e, level = sim.level, g = sim.gather;
  const B = sim.balls;
  let n = 0;
  const put = (x,y,r) => { if(n>=MAXB) return; B[n*3]=x; B[n*3+1]=y; B[n*3+2]=r; n++; };

  const lifeK = G.life;
  const breath = Math.sin(sim.breathT*Math.PI*2);
  /* breathing changes its volume, not its outline: it swells and settles */
  const swell = 1 + lifeK*(0.052 + 0.028*sim.attn)*breath;
  /* tremor: the small constant unsteadiness of something that is awake */
  const trem = lifeK*0.0055*(0.35 + sim.attn);
  const tx = Math.sin(time*11.3 + sim.seed)*trem + Math.sin(time*7.1 + sim.seed*2)*trem*0.6;
  const ty = Math.cos(time*9.7 + sim.seed*3)*trem + Math.sin(time*13.9 + sim.seed)*trem*0.5;
  const leanX = sim.leanX + tx;
  const leanY = sim.leanY + ty + sim.bob*0.16;

  const coreY = -1.02*(1-g) + sim.riseY + lifeK*breath*0.012;
  const ballR = p.ball*swell;
  const shaped = p.shape > 0;
  const splitting = p.split > 0.5;
  const NB = shaped ? 20 : (splitting ? 14 : NPOOL);
  const ax = Math.cos(sim.axis), ay = Math.sin(sim.axis);
  const sep = sim.sep;
  const side = (x, y) => {
    const d = (x*ax + y*ay) / Math.max(ballR*0.34, 1e-4);
    return Math.max(-1, Math.min(1, d));
  };
  /* which chunk a point belongs to, by its angle around the body */
  const K = sim.chunkN;
  const chunkAt = (x, y) => {
    if(K < 2) return sim.chunks[0];
    let a = Math.atan2(y, x) - sim.axis;
    a = ((a % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    return sim.chunks[Math.min(K-1, Math.floor(a/(Math.PI*2)*K))];
  };
  const wob2 = G.wobble;
  const restR = 0.295*Math.sqrt(NPOOL/NB);
  const pt = [0,0,0,0,0];

  for(let i=0;i<NB;i++){
    const u = NB > 1 ? (i/(NB-1))*2 - 1 : 0;
    const wob = Math.sin(time*(0.43+i*0.19)+i*2.3)*0.016*(0.35+level);
    let gx, gy, gr;
    if(shaped){
      /* strung along the magnet's outline */
      simShapePoint(sim, i/NB + sim.spin*0.02, pt);
      gx = pt[0]*ballR;
      gy = pt[1]*ballR;
      gr = p.thick + level*0.012;
    }else if(splitting){
      /* an even disc of mass, pulled apart along the current axis */
      const rr = ballR*0.60*Math.sqrt((i+0.5)/NB);
      const a = i*2.39996;
      const bx = rr*Math.cos(a), by = rr*Math.sin(a);
      const s = side(bx, by);
      gx = bx + ax*s*sep + Math.cos(time*0.6+i*2.1)*0.009;
      gy = by + ay*s*sep + Math.sin(time*0.5+i*1.7)*0.009;
      gr = ballR*0.42*Math.sqrt(NPOOL/NB) + level*0.016;
    }else{
      gx = Math.cos(time*0.6+i*2.1)*0.013;
      gy = Math.sin(time*0.5+i*1.7)*0.013;
      gr = ballR*0.42 + level*0.028;
    }
    /* nothing is uniform: every ball drifts and breathes on its own clock */
    const irr = wob2*0.055;
    gx += Math.sin(time*(0.61 + i*0.13) + i*4.7)*irr;
    gy += Math.cos(time*(0.53 + i*0.17) + i*3.1)*irr;
    gr *= 1 + wob2*0.32*Math.sin(time*(0.44 + i*0.09) + i*2.2);

    const ch = chunkAt(gx, gy);
    gx += ch.x + leanX; gy += ch.y + leanY;
    gr *= swell;

    const px = u*0.56*(1-g) + gx*g;
    const py = (coreY + level*0.10 + lifeK*breath*0.010 + sim.bob*0.05)*(1-g)
             + wob*(1-g*0.6) + gy*g;
    const pr = (restR + level*0.030)*(1-g) + gr*g;
    put(px, py, pr + Math.abs(wob)*(1-g));
  }

  const coreR = ballR*g + level*0.030*g;

  for(const s of sim.spikes){
    const L = s.len;
    const Ln = Math.min(L/Math.max(p.reach,0.01), 1);

    const restX = s.x + s.walk + Math.sin(time*s.rate + s.phase)*0.020;
    const restY = moundY(restX, level) - 0.06;
    let rdx = s.u*0.52 + Math.sin(time*s.rate*1.7 + s.phase*2.1)*0.14*Ln*(0.4+p.turb);
    const rl = Math.hypot(rdx,1); rdx /= rl;
    const rdy = 1/rl;

    const th = s.theta + sim.spin + Math.sin(time*s.rate*0.6 + s.phase)*0.10*p.turb;
    let gdx = Math.cos(th), gdy = Math.sin(th);
    let anchorX = gdx*coreR*0.62, anchorY = gdy*coreR*0.62;

    if(splitting){
      const bx = gdx*coreR*0.72, by = gdy*coreR*0.72;
      const s = side(bx, by);
      anchorX = bx + ax*s*sep;
      anchorY = by + ay*s*sep;
    }
    if(p.shape > 0){
      /* stand off the outline, pointing away from it */
      simShapePoint(sim, s.band/sim.spikes.length + sim.spin*0.02, pt);
      gdx = pt[2]; gdy = pt[3];
      anchorX = pt[0]*p.ball + gdx*p.thick*0.5;
      anchorY = pt[1]*p.ball + gdy*p.thick*0.5;
      s.corner = pt[4];
    }

    const dx = rdx*(1-g) + gdx*g, dy = rdy*(1-g) + gdy*g;
    const dl = Math.hypot(dx,dy) || 1;
    const ux = dx/dl, uy = dy/dl;

    const chS = chunkAt(anchorX, anchorY);
    anchorX += chS.x + leanX; anchorY += chS.y + leanY;

    const baseX = restX*(1-g) + anchorX*g;
    const baseY = restY*(1-g) + (coreY*(1-g) + anchorY)*g;

    const w = (0.086 - 0.034*Ln*p.sharp) * (1 - 0.18*Math.abs(s.u)*(1-g))
            * (0.7 + p.ball*2.0)
            * (1 + G.wobble*0.38*Math.sin(time*(0.37 + s.rate) + s.phase*2.3));
    const ts = [0.30,0.56,0.79,1.0];
    const rs = [1.0,0.76,0.50, 0.26 + (1-p.sharp)*0.20];

    for(let k=0;k<PERSPIKE;k++){
      let rr = w*rs[k];
      if(s.band===0 && k===PERSPIKE-1 && Ln>0.45){
        rr = w*(0.30 + sim.bass*1.05*(Ln-0.45)/0.55*(1-g*0.6));
      }
      const seg = Math.sin(time*(s.rate*1.3 + k*0.29) + s.phase + k*1.9)*0.035*p.turb*Ln;
      put(baseX + ux*L*ts[k] - uy*seg, baseY + uy*L*ts[k] + ux*seg, rr);
    }
    s.tipX = baseX + ux*L; s.tipY = baseY + uy*L;
    s.dirX = ux; s.dirY = uy;
  }

  for(const d of sim.drops) put(d.x, d.y, d.r);
  return n;
}

function stepSim(sim, dt, time){
  applyGlobals(sim);
  const p = sim.e;

  /* ---------------------------------------------------------------
     Inner life. None of this is a reaction to the current frame's audio;
     it is state the body carries around between frames, which is the
     difference between something that responds and something that is
     present in the room with you.
     --------------------------------------------------------------- */
  const life = G.life;

  /* breathing, on a period that itself drifts so it never counts time */
  sim.breathT += dt*(0.20 + 0.09*Math.sin(time*0.11 + sim.seed));
  const breath = Math.sin(sim.breathT*Math.PI*2);

  /* attention: rises fast when it hears you, lets go slowly. This is what
     makes it stay alert through a pause instead of dropping the moment
     you stop making noise. */
  const want = Math.max(sim.voiced, Math.min(1, sim.excite*0.8));
  const arate = want > sim.attn ? 3.2 : (0.16 + (1 - G.attnHold)*0.55);
  sim.prevAttn = sim.attn;
  sim.attn += (want - sim.attn)*Math.min(1, dt*arate);

  /* habituation: a steady sound stops being interesting, a change does not */
  sim.hab += (sim.level - sim.hab)*Math.min(1, dt*0.30);
  sim.novelty = Math.max(0, sim.level - sim.hab*0.72);

  /* where its attention is pointed. It re-aims on its own schedule, more
     often when it is engaged, which reads as looking toward things. */
  sim.focusTimer -= dt;
  if(sim.focusTimer <= 0){
    sim.focusA = Math.random()*Math.PI*2;
    sim.focusR = 0.2 + Math.random()*0.8;
    sim.focusTimer = (0.7 + Math.random()*2.6)/(0.45 + sim.attn*1.3);
  }
  const leanAmt = life*0.115*(0.30 + sim.attn*0.9);
  const ltx = Math.cos(sim.focusA)*sim.focusR*leanAmt;
  const lty = Math.sin(sim.focusA)*sim.focusR*leanAmt;
  sim.leanX += (ltx - sim.leanX)*Math.min(1, dt*(1.6 + sim.attn*2.2));
  sim.leanY += (lty - sim.leanY)*Math.min(1, dt*(1.6 + sim.attn*2.2));

  /* body-level recoil, so the whole mass answers a sound and not just
     the spike that happens to own that frequency */
  sim.bobVel += -sim.bob*46.0*dt;
  sim.bobVel -= sim.bobVel*Math.min(1, dt*(4.2 + p.visc*4.0));
  sim.bob += sim.bobVel*dt;

  /* anticipation: it gathers itself in for a beat before it extends */
  sim.coil = Math.max(0, sim.coil - dt*5.5);

  /* it is never entirely still, even with nothing to listen to */
  sim.idleTwitch -= dt;
  if(sim.idleTwitch <= 0){
    sim.idleTwitch = (1.8 + Math.random()*5.5)/(0.5 + sim.attn);
    sim.bobVel += (Math.random() - 0.5)*0.9*life;
    sim.focusTimer = Math.min(sim.focusTimer, 0.15);
  }

  /* the settle: when it finally lets go of a conversation, it sags */
  if(sim.prevAttn > 0.26 && sim.attn <= 0.26) sim.bobVel -= 0.55*life;

  /* voice gate, per sim threshold */
  const vTarget = vRaw > (0.010 + p.gate*0.055) ? 1 : 0;
  sim.voiced += (vTarget - sim.voiced) * Math.min(1, dt*(vTarget?26:6));

  sim.level = (bands.mid*0.52 + bands.low*0.34 + bands.high*0.14)
            * Math.min(1, p.sens) * (0.25 + 0.75*sim.voiced);
  sim.bass = bands.low;

  /* the wisp shares the inner life above, none of the fluid below */
  if(p.wisp){ stepWisp(sim, dt, time); return; }

  /* gather: rises while there is voice, falls under gravity when there isn't */
  const holding = sim.gatherHold > 0;
  if(sim.voiced > 0.5){
    /* a fresh utterance swaps the magnet out for the next one */
    if(!holding && p.morph > 0.5){
      sim.cycleI = (sim.cycleI + 1) % CYCLE.length;
      sim.shapeB = sim.shapeA;
      sim.shapeA = CYCLE[sim.cycleI];
      sim.morphT = 0;
    }
    sim.gatherHold = p.hold;
  }
  sim.morphT = Math.min(1, sim.morphT + dt*2.2);
  if(p.morph < 0.5 && sim.shapeA !== p.shape){ sim.shapeA = sim.shapeB = p.shape; sim.morphT = 1; }
  sim.gatherHold = Math.max(0, sim.gatherHold - dt);
  const gTarget = sim.gatherHold > 0 ? Math.max(p.rest, p.gathr) : p.rest;
  const GRAV = 1.8 + p.weight*5.2;

  if(sim.gather < gTarget){
    sim.gatherVel = 0;
    sim.gather += (gTarget - sim.gather) * Math.min(1, dt*(4.2 - p.visc*1.9));
  }else{
    sim.gatherVel -= GRAV*dt;
    sim.gather += sim.gatherVel*dt;
    if(sim.gather <= gTarget){
      sim.gather = gTarget;
      sim.gatherVel = Math.abs(sim.gatherVel) > 0.7 ? -sim.gatherVel*0.16 : 0;
    }
  }
  sim.gather = Math.min(1, Math.max(0, sim.gather));

  /* float mode: speech is the only thing keeping it up */
  if(p.lift > 0.5){
    sim.hoverVel += sim.level*p.buoy*2.6*dt;             /* held up by the rhythm */
    sim.hoverVel -= (0.14 + p.pull*0.85)*dt;             /* a gentle, patient pull */
    sim.hoverVel *= 1 - Math.min(1, dt*(0.7 + p.visc*2.4));
    sim.hover += sim.hoverVel*dt;
    if(sim.hover > 1){ sim.hover = 1; sim.hoverVel = Math.min(0, sim.hoverVel)*0.4; }
    if(sim.hover < 0){ sim.hover = 0; sim.hoverVel = Math.max(0, sim.hoverVel)*0.25; }
    sim.gather = Math.min(1, sim.hover*2.2);
    sim.riseY = sim.hover*0.52*sim.gather;
  }else{
    sim.riseY = 0;
  }

  /* sectors drift continuously, so the seam is never in the same place */
  sim.chunkN = p.split > 0.5 ? 2 : 4;
  sim.axis += dt*(0.13 + p.turb*0.19);
  sim.excite = Math.max(0, sim.excite - dt*1.1);

  /* how likely any one sector is to let go, right now */
  const rate = G.breakup * (0.015 + G.breakRate*0.30)
             * (0.02 + sim.level*3.0 + sim.excite*1.8)
             * (sim.gather > 0.30 ? 1 : 0);

  const coh = 30.0 - G.breakup*13.0;
  const cdamp = 2.8 + p.visc*3.2;
  for(let i=0;i<4;i++){
    const c = sim.chunks[i];
    if(i >= sim.chunkN){
      c.vx = c.vy = 0;
      c.x *= 1 - Math.min(1, dt*6); c.y *= 1 - Math.min(1, dt*6);
      continue;
    }
    c.cool = Math.max(0, c.cool - dt);
    if(c.cool <= 0 && rate > 0 && Math.random() < 1 - Math.exp(-rate*dt)){
      peel(sim, i, 0.4 + Math.random()*0.8);
    }
    c.vx += -c.x*coh*dt;
    c.vy += -c.y*coh*dt;
    c.vy -= p.weight*0.9*dt;
    c.vx -= c.vx*Math.min(1, cdamp*dt);
    c.vy -= c.vy*Math.min(1, cdamp*dt);
    c.x += c.vx*dt; c.y += c.vy*dt;
    const m = Math.hypot(c.x, c.y), lim = 0.58;
    if(m > lim){ c.x = c.x/m*lim; c.y = c.y/m*lim; c.vx *= 0.3; c.vy *= 0.3; }
  }

  sim.spin += dt*(0.06 + p.turb*0.14)*(0.4 + sim.gather);

  const damp = 5.5 + p.visc*17.0;
  const stiff = (250 - p.visc*90) * (1 + p.weight*0.55);
  const nS = sim.spikes.length;

  for(let i=0;i<nS;i++){
    const s = sim.spikes[i];
    s.gainT += dt*0.11*(0.6+i*0.07);
    s.biasT += dt*0.07*(0.5+i*0.09);
    s.gain = 0.72 + 0.55*(Math.sin(s.gainT)*0.5 + 0.5 + Math.sin(s.gainT*2.37)*0.2);
    s.bias = Math.sin(s.biasT)*0.8 + Math.sin(s.biasT*1.73)*0.2;
    s.walk += (Math.sin(time*(0.19+i*0.031)+s.phase)*0.08 - s.walk)*dt*0.6;

    /* its own slice of the speech range, with bleed from the neighbours */
    const si = Math.min(SLICES-1, Math.floor(s.band / nS * SLICES));
    const own = sliceNorm[si];
    const nb = (sliceNorm[Math.max(0,si-1)] + sliceNorm[Math.min(SLICES-1,si+1)])*0.5;
    const e = Math.min(1, (own*0.74 + nb*0.26) * p.sens) * (1 + s.bias*0.22*p.turb);

    s.energy += (e*s.gain - s.energy) * Math.min(1, dt*(26 - p.visc*13));

    const jitter = 1 + Math.sin(time*(1.7 + s.rate*3.1) + s.phase*3.7)*0.22*p.turb;
    const gateMix = 0.14 + 0.86*sim.voiced;
    const corner = 1 + (s.corner || 0) * 1.15 * sim.gather;
    /* alert body reaches further; a change in the sound reaches further
       still; and for a beat after an onset it draws in first */
    const alert = 1 + G.life*(sim.attn*0.42 + sim.novelty*1.30 - sim.coil*0.40);
    /* a slow idle sway so it is doing something even in silence */
    const idle = G.life*0.012*(1 - sim.attn)*(0.5 + 0.5*Math.sin(time*(0.5 + s.rate) + s.phase));
    const target = (0.028 + idle + s.energy*(p.reach*0.78 + bands.mid*p.reach*0.35)*gateMix*corner*alert)
                 * jitter * (reduced ? 0.45 : 1);

    s.vel += (target - s.len)*stiff*dt;
    s.vel -= (2.4 + p.weight*6.6)*dt;
    s.vel -= s.vel*Math.min(1, damp*dt);
    s.vel -= s.vel*Math.abs(s.vel)*(2.5 + p.visc*11.0)*dt;

    const stick = 0.006 + p.visc*0.030;
    if(Math.abs(target - s.len) < stick && Math.abs(s.vel) < 0.35){
      s.vel *= 1 - Math.min(1, dt*(14 + p.visc*34));
    }

    s.len += s.vel*dt;
    if(s.len < 0.012){ s.len = 0.012; s.vel = Math.max(0, s.vel); }
    const cap = p.reach*(1 + (s.corner||0)*1.15);
    if(s.len > cap){ s.len = cap; s.vel = Math.min(0, s.vel); }
  }

  for(let i=sim.drops.length-1;i>=0;i--){
    const d = sim.drops[i];
    d.vy -= (13.0 + p.weight*26.0)*dt;
    d.x += d.vx*dt; d.y += d.vy*dt;
    d.vx *= 1 - dt*(0.35 + p.visc*0.9);
    const coreY = -1.02*(1-sim.gather);
    const absorbed = Math.hypot(d.x, d.y - coreY) < (p.ball*1.9*sim.gather + 0.02);
    if(absorbed || d.y < moundY(d.x, sim.level) - 0.02 || Math.hypot(d.x,d.y) > 1.05){
      sim.drops.splice(i,1);
    }
  }
}

/* The body is divided into rotating sectors, and each one decides on its own
   whether to peel away. There is no schedule and no shared trigger: a sector
   detaches on a Poisson draw whose rate rises with how much energy is in the
   voice, so breaks cluster around active speech without ever landing on a
   beat. Magnitudes are heavily skewed, so most are a slight bulge and only
   occasionally does a piece fully leave. */
function peel(sim, idx, strength){
  const p = sim.e;
  const K = sim.chunkN;
  const c = sim.chunks[idx];
  const a = sim.axis + (idx + 0.5)*(Math.PI*2/K) + (Math.random() - 0.5)*0.9;
  /* cubed random: mostly small, rarely large */
  const roll = Math.random();
  const mag = 0.18 + roll*roll*roll*2.2;
  const push = (0.055 + p.ball*0.75) * (9.0 + 30.0*G.breakup) * mag * (0.5 + strength*0.8);
  c.vx += Math.cos(a)*push;
  c.vy += Math.sin(a)*push;
  c.cool = 0.6 + Math.random()*2.8;

  /* a dividing body throws the opposite lobe the other way */
  if(p.split > 0.5 && K === 2){
    const o = sim.chunks[1 - idx];
    o.vx -= Math.cos(a)*push*(0.7 + Math.random()*0.5);
    o.vy -= Math.sin(a)*push*(0.7 + Math.random()*0.5);
    o.cool = c.cool;
  }
}

function splash(sim, strength){
  if(reduced) return;
  const p = sim.e;
  if(p.lift > 0.5) sim.hoverVel += p.buoy*(0.30 + strength*0.55);
  /* a strong syllable makes a break more likely for a moment; it does not
     cause one, so the splitting never locks to the rhythm */
  sim.excite = Math.min(2.2, sim.excite + strength*0.9);
  sim.coil = Math.min(1, sim.coil + strength*0.9);        /* pull in, then burst */
  sim.bobVel += strength*0.55*G.life;                     /* the whole body answers */
  if(Math.random() < 0.22 + strength*0.3) sim.focusTimer = Math.min(sim.focusTimer, 0.1);
  if(sim.p.wisp){
    /* a syllable is a soft push into the wobble springs, not a spike */
    if(sim.w) for(const h of sim.w.harm)
      h.vel += (Math.random() - 0.5)*2.4*strength*(0.4 + p.splash);
    return;
  }
  const count = 1 + Math.round(strength*2*p.splash);
  let best = sim.spikes[0];
  for(const s of sim.spikes) if(s.len > best.len) best = s;
  for(let i=0;i<count;i++){
    if(sim.drops.length >= MAXDROPS) break;
    const sp = (1.2 + Math.random()*1.5)*(0.65 + p.weight*0.75)*(0.55 + strength)*(0.5 + p.splash);
    sim.drops.push({
      x: best.tipX + (Math.random()-0.5)*0.09,
      y: best.tipY + (Math.random()-0.5)*0.05,
      vx: best.dirX*sp + (Math.random()-0.5)*0.9,
      vy: best.dirY*sp + Math.random()*0.6,
      r: 0.014 + Math.random()*0.022,
    });
    best.vel += 0.9*p.splash;
  }
  for(const s of sim.spikes) s.vel += (Math.random()-0.5)*1.4*p.turb*strength;
}

/* ================================================================== */
/* Audio: one analyser, shared by all six                              */
/* ================================================================== */
let ac=null, analyser=null, freq=null, prevFreq=null, stream=null, listening=false;
const bands  = {low:0, mid:0, high:0};
const peaks  = {low:0.02, mid:0.02, high:0.02};
const floors = {low:0.02, mid:0.02, high:0.02};
const sliceE = new Float32Array(SLICES);
const sliceFloor = new Float32Array(SLICES).fill(0.02);
const slicePeak  = new Float32Array(SLICES).fill(0.03);
const sliceNorm  = new Float32Array(SLICES);
let vRaw = 0, onsetPulse = 0, voicedUI = 0;
const fluxHist = [];
let fluxCooldown = 0;

function bandEnergy(a, b){
  let s = 0;
  for(let i=a;i<b;i++) s += freq[i];
  return s / Math.max(1, b-a) / 255;
}

async function startMic(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    await ac.resume();
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.55;
    src.connect(analyser);
    freq = new Uint8Array(analyser.frequencyBinCount);
    prevFreq = new Uint8Array(analyser.frequencyBinCount);
    listening = true;
    setState('Listening', 'live');
    micBtn.textContent = 'Stop listening';
    if(ac.state === 'suspended') introWaitForGesture();
    else introDismiss();
    return true;
  }catch(err){
    setState('Mic blocked', 'error');
    introBlocked();
    return false;
  }
}
function stopMic(){
  if(stream) stream.getTracks().forEach(t => t.stop());
  stream = null; analyser = null; listening = false;
  setState('Idle', '');
  micBtn.textContent = 'Start listening';
}

function readAudio(dt, t){
  if(!listening || !analyser){
    const breath = (Math.sin(t*0.6)*0.5 + 0.5)*0.05;
    bands.low = breath; bands.mid = breath*0.5; bands.high = breath*0.25;
    for(let i=0;i<SLICES;i++) sliceNorm[i] = breath*(0.7 + 0.5*Math.sin(t*0.4 + i*0.7));
    vRaw = 0; voicedUI = 0;
    return;
  }

  analyser.getByteFrequencyData(freq);
  const nyq = ac.sampleRate/2;
  const bin = f => Math.max(1, Math.min(freq.length-1, Math.round(f/nyq*freq.length)));

  const raw = {
    low:  bandEnergy(bin(90),   bin(400)),
    mid:  bandEnergy(bin(400),  bin(2600)),
    high: bandEnergy(bin(2600), bin(8000)),
  };
  for(const k of ['low','mid','high']){
    const fr = raw[k] < floors[k] ? 4.0 : 0.10;
    floors[k] += (raw[k] - floors[k])*Math.min(1, dt*fr);
    const net = Math.max(0, raw[k] - floors[k]*1.35);
    peaks[k] = Math.max(net, peaks[k]*(1 - dt*0.30), 0.012);
    const target = Math.min(1, net/peaks[k]);
    const rate = target > bands[k] ? (k==='high'?34:26) : 9;
    bands[k] += (target - bands[k])*Math.min(1, dt*rate);
  }

  vRaw = Math.max(0, raw.mid - floors.mid*1.7) + Math.max(0, raw.low - floors.low*1.7)*0.6;
  voicedUI += ((vRaw > 0.029 ? 1 : 0) - voicedUI)*Math.min(1, dt*16);

  for(let b=0;b<SLICES;b++){
    const f0 = VOICE_LO*Math.pow(VOICE_HI/VOICE_LO, b/SLICES);
    const f1 = VOICE_LO*Math.pow(VOICE_HI/VOICE_LO, (b+1)/SLICES);
    const e = bandEnergy(bin(f0), bin(f1));
    const fr = e < sliceFloor[b] ? 4.0 : 0.10;
    sliceFloor[b] += (e - sliceFloor[b])*Math.min(1, dt*fr);
    const net = Math.max(0, e - sliceFloor[b]*1.35);
    slicePeak[b] = Math.max(net, slicePeak[b]*(1 - dt*0.26), 0.012);
    sliceNorm[b] = Math.min(1, net/slicePeak[b]);
  }

  let flux = 0;
  const lo = bin(300), top = bin(6500);
  for(let i=lo;i<top;i++){ const d = freq[i]-prevFreq[i]; if(d>0) flux += d; }
  flux /= (top-lo)*255;
  prevFreq.set(freq);

  fluxHist.push(flux);
  if(fluxHist.length > 43) fluxHist.shift();
  const mean = fluxHist.reduce((a,b)=>a+b,0)/fluxHist.length;
  const varc = fluxHist.reduce((a,b)=>a+(b-mean)*(b-mean),0)/fluxHist.length;
  const thresh = mean + 1.55*Math.sqrt(varc) + 0.004;

  fluxCooldown -= dt;
  onsetPulse = Math.max(0, onsetPulse - dt*4.5);
  if(flux > thresh && fluxCooldown <= 0 && voicedUI > 0.35){
    fluxCooldown = 0.09;
    onsetPulse = 1;
    const strength = Math.min(1, flux/Math.max(thresh,1e-4) - 0.6);
    for(const sim of sims) if(sim.voiced > 0.3) splash(sim, strength);
  }
}

/* ================================================================== */
/* Layout + frame loop                                                 */
/* ================================================================== */
let dpr = 1, stageRect = {x:0, y:0, w:1, h:1};
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth*dpr);
  canvas.height = Math.floor(innerHeight*dpr);
  measure();
}
function measure(){
  const r = stage.getBoundingClientRect();
  stageRect = {
    x: Math.round(r.left*dpr),
    y: Math.round(canvas.height - r.bottom*dpr),
    w: Math.round(r.width*dpr),
    h: Math.round(r.height*dpr),
  };
}
addEventListener('resize', () => requestAnimationFrame(resize));

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  const t = now/1000;

  readAudio(dt, t);
  measure();

  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(inverted?0.969:0.031, inverted?0.973:0.027, inverted?0.961:0.039, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  const sim = sims[active];
  stepSim(sim, dt, t);
  const count = buildBalls(sim, t);

  const r = stageRect;
  gl.uniform2f(U.center, r.x + r.w/2, r.y + r.h/2);
  gl.uniform1f(U.discR, Math.min(r.w, r.h)*0.40);
  gl.uniform3fv(U.balls, sim.balls);
  gl.uniform1i(U.count, count);
  gl.uniform1f(U.time, t);
  const wisp = sim.p.wisp || 0;
  gl.uniform1f(U.warp, (wisp
    ? 0.012 + sim.level*0.012
    : 0.020 + sim.e.turb*0.075*(0.45 + sim.level*1.1)) * (reduced?0.4:1));
  gl.uniform1f(U.invert, inverted ? 1 : 0);
  gl.uniform1f(U.style, wisp);
  gl.uniform2f(U.light, sim.w ? sim.w.lx : 0.20, sim.w ? sim.w.ly : 0.26);
  gl.uniform1f(U.glow, sim.w ? sim.w.glow : 0.8);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  mLow.style.width  = (bands.low*100).toFixed(0)+'%';
  mMid.style.width  = (bands.mid*100).toFixed(0)+'%';
  mHigh.style.width = (bands.high*100).toFixed(0)+'%';
  mOnset.style.width = (onsetPulse*100).toFixed(0)+'%';
  mVoiced.style.width = (voicedUI*100).toFixed(0)+'%';

  requestAnimationFrame(frame);
}

const mHigh=document.getElementById('mHigh'), mOnset=document.getElementById('mOnset');

function setState(text, cls){
  stateLabel.textContent = text;
  dot.className = 'dot' + (cls ? ' '+cls : '');
}
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function fmt(key, v){
  if(key === 'shape') return SHAPE_NAMES[Math.round(v)];
  if(key === 'spikes') return String(Math.round(v));
  if(key === 'morph' || key === 'lift' || key === 'split') return v > 0.5 ? 'on' : 'off';
  return v.toFixed(2);
}

/* ---- preset rail ---- */
sims.forEach((sim, i) => {
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.setAttribute('role', 'tab');
  chip.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
  chip.innerHTML = '<span class="n">' + (i+1) + '</span><span class="nm">' + sim.p.name + '</span>';
  chip.addEventListener('click', () => selectPreset(i));
  rail.appendChild(chip);
});

function selectPreset(i){
  active = i;
  [...rail.children].forEach((c, k) => c.setAttribute('aria-selected', k === i ? 'true' : 'false'));
  modeName.textContent = sims[i].p.name;
  syncPresetControls();
}

/* ---- sidebar ---- */
function buildSection(title, blurb, list, get, set, onChange){
  const sect = document.createElement('div');
  sect.className = 'sect';
  const h = document.createElement('h2');
  h.textContent = title;
  sect.appendChild(h);
  const p = document.createElement('p');
  p.textContent = blurb;
  sect.appendChild(p);
  for(const [key, label, min, max, step] of list){
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.dataset.key = key;
    wrap.innerHTML =
      '<label for="k-' + key + '">' + label + ' <var>' + fmt(key, get(key)) + '</var></label>' +
      '<input type="range" id="k-' + key + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + get(key) + '">';
    const input = wrap.querySelector('input');
    const out = wrap.querySelector('var');
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      set(key, v);
      out.textContent = fmt(key, v);
      if(onChange) onChange(key);
    });
    sect.appendChild(wrap);
  }
  return sect;
}

const presetSect = buildSection(
  'This preset', 'Size, shape and behaviour. Only affects the selected mode.',
  PRESET_CONTROLS,
  k => sims[active].p[k],
  (k, v) => { sims[active].p[k] = v; },
  k => { if(k === 'spikes') makeSpikes(sims[active]); }
);
const presetRow = document.createElement('div');
presetRow.className = 'row';
const revertBtn = document.createElement('button');
revertBtn.className = 'btn quiet';
revertBtn.textContent = 'Revert preset';
revertBtn.addEventListener('click', () => {
  Object.assign(sims[active].p, PRESETS[active]);
  makeSpikes(sims[active]);
  syncPresetControls();
  toast(sims[active].p.name + ' reverted');
});
const copyBtn = document.createElement('button');
copyBtn.className = 'btn quiet';
copyBtn.textContent = 'Copy';
copyBtn.addEventListener('click', () => {
  const p = sims[active].p;
  const txt = (active+1) + ' ' + p.name + '\n\nThis preset\n' +
    PRESET_CONTROLS.map(([k,l]) => '  ' + l + ': ' + fmt(k, p[k])).join('\n') +
    '\n\nVoice response\n' +
    CONTROLS.map(([k,l]) => '  ' + l + ': ' + fmt(k, G[k])).join('\n');
  navigator.clipboard.writeText(txt).then(() => toast('Settings copied'), () => toast('Copy failed'));
});
presetRow.appendChild(revertBtn);
presetRow.appendChild(copyBtn);
presetSect.appendChild(presetRow);
side.appendChild(presetSect);

const feelSect = buildSection(
  'Voice response', 'How it hears and moves. Shared across every mode.',
  CONTROLS,
  k => G[k],
  (k, v) => { G[k] = v; }
);
const feelRow = document.createElement('div');
feelRow.className = 'row';
const feelReset = document.createElement('button');
feelReset.className = 'btn quiet';
feelReset.textContent = 'Reset response';
feelReset.addEventListener('click', () => {
  Object.assign(G, G_DEFAULTS);
  syncFeelControls();
  toast('Voice response reset');
});
feelRow.appendChild(feelReset);
feelSect.appendChild(feelRow);
side.appendChild(feelSect);

function syncSection(sect, get){
  sect.querySelectorAll('.ctl').forEach(wrap => {
    const key = wrap.dataset.key;
    wrap.querySelector('input').value = get(key);
    wrap.querySelector('var').textContent = fmt(key, get(key));
  });
}
const syncPresetControls = () => syncSection(presetSect, k => sims[active].p[k]);
const syncFeelControls   = () => syncSection(feelSect,   k => G[k]);

allBtn.addEventListener('click', () => {
  const open = document.body.classList.toggle('side-open');
  allBtn.textContent = open ? 'Hide controls' : 'Controls';
  requestAnimationFrame(resize);
});

resetBtn.addEventListener('click', () => {
  Object.assign(G, G_DEFAULTS);
  sims.forEach((sim, i) => {
    Object.assign(sim.p, PRESETS[i]);
    makeSpikes(sim);
    sim.gather = sim.p.rest; sim.gatherVel = 0; sim.drops.length = 0;
    sim.chunks.forEach(c => { c.x = c.y = c.vx = c.vy = 0; });
  });
  syncPresetControls(); syncFeelControls();
  toast('Everything reset');
});

themeBtn.addEventListener('click', () => setTheme(!inverted));
function setTheme(on){
  inverted = on;
  document.body.classList.toggle('light', on);
  themeBtn.textContent = on ? 'Dark' : 'Light';
}
setTheme(false);   /* dark is the default; the Light button switches it */

micBtn.addEventListener('click', () => listening ? stopMic() : startMic());

/* fullscreen: hide every control and leave the orb alone in the room */
const fsBtn = document.getElementById('fsBtn');
const zenExit = document.getElementById('zenExit');
let zen = false;
function setZen(on){
  zen = on;
  document.body.classList.toggle('zen', on);
  if(on){
    document.body.classList.remove('side-open');
    allBtn.textContent = 'Controls';
    fsBtn.blur();
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req && !document.fullscreenElement){
      try{ Promise.resolve(req.call(el)).catch(() => {}); }catch(err){}
    }
  }else if(document.fullscreenElement && document.exitFullscreen){
    document.exitFullscreen().catch(() => {});
  }
}
fsBtn.addEventListener('click', () => setZen(true));
zenExit.addEventListener('click', () => setZen(false));
document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement && zen){ zen = false; document.body.classList.remove('zen'); }
});
addEventListener('keydown', e => {
  if(e.key === 'Escape' && zen && !document.fullscreenElement) setZen(false);
});

addEventListener('keydown', e => {
  if(e.target !== document.body) return;
  if(e.code === 'Space'){ e.preventDefault(); listening ? stopMic() : startMic(); }
  if(e.key >= '1' && e.key <= '9') selectPreset(+e.key - 1);
  if(e.key === '0' && sims.length > 9) selectPreset(9);
  if(e.key === 'i') setTheme(!inverted);
  if(e.key === 'c') allBtn.click();
  if(e.key === 'f') setZen(!zen);
  if(e.key === 'ArrowRight') selectPreset((active + 1) % sims.length);
  if(e.key === 'ArrowLeft') selectPreset((active - 1 + sims.length) % sims.length);
});

selectPreset(0);

/* ---- opening: ask for the microphone straight away ---- */
const intro = document.getElementById('intro');
const introLead = document.getElementById('introLead');
const introSub = document.getElementById('introSub');
const introBtn = document.getElementById('introBtn');
let introDone = false;

function introDismiss(){
  if(introDone) return;
  introDone = true;
  intro.classList.add('gone');
  setTimeout(() => { intro.style.display = 'none'; }, 800);
}
function introBlocked(){
  intro.classList.add('settled');
  introLead.textContent = 'Microphone blocked';
  introSub.textContent = 'Allow access for this page in your browser settings, then try again. You can also look around without it.';
  introBtn.hidden = false;
  introBtn.textContent = 'Try again';
}
/* some browsers will not start audio until the page has been touched */
function introWaitForGesture(){
  intro.classList.add('settled');
  introLead.textContent = 'Ready';
  introSub.textContent = 'Click anywhere to begin listening.';
  const go = async () => {
    try{ await ac.resume(); }catch(e){}
    removeEventListener('pointerdown', go);
    removeEventListener('keydown', go);
    introDismiss();
  };
  addEventListener('pointerdown', go, {once:false});
  addEventListener('keydown', go, {once:false});
}

introBtn.addEventListener('click', async () => {
  introLead.textContent = 'Turning on the microphone';
  introSub.textContent = 'Your voice drives the fluid. Nothing is recorded or sent anywhere.';
  intro.classList.remove('settled');
  introBtn.hidden = true;
  await startMic();
});

/* let the first frame paint, then ask */
requestAnimationFrame(() => setTimeout(startMic, 250));

/* never trap anyone behind the opening screen */
setTimeout(() => { if(!introDone && !listening) introBlocked(); }, 9000);
intro.addEventListener('dblclick', introDismiss);

resize();
addEventListener('load', resize);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
